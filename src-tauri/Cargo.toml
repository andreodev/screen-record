[package]
name = "screen-studio"
version = "0.1.0"
description = "Cross-platform screen recorder prototype"
authors = ["Andre"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "screen_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tiny-skia = "0.12"
base64 = "0.22"
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Performance", "Win32_Devices_FunctionDiscovery", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Keep the CPU compositor usable in development builds as well.
[profile.dev.package.screen-studio]
opt-level = 2
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
[profile.dev.package.pxfm]
opt-level = 3
